<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>tickdeck from a CDN</title>
    <!--
      tickdeck from jsDelivr, no install and no build step. This one module
      registers the tdk-* elements and exports every API.
    -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@tickdeck/all@0.1.0-alpha.2/dist/tickdeck.js"></script>
    <style>
      /* One flat token set for the page, the chart and the widgets. */
      :root {
        --app-bg: #e9ecf0;
        --tdk-color-surface: #ffffff;
        --tdk-color-surface-2: #f3f5f7;
        --tdk-color-text: #1b1f24;
        --tdk-color-text-muted: #5b6470;
        --tdk-color-border: #d4d8de;
        --tdk-color-grid: #eef0f3;
        --tdk-color-accent: #2f6fdf;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --app-bg: #0d1013;
          --tdk-color-surface: #15191e;
          --tdk-color-surface-2: #1f252c;
          --tdk-color-text: #e6e9ed;
          --tdk-color-text-muted: #9aa4af;
          --tdk-color-border: #343c46;
          --tdk-color-grid: #20262d;
          --tdk-color-accent: #5b94f0;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--app-bg);
        color: var(--tdk-color-text);
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 8px 12px;
        background: var(--tdk-color-surface);
        border-bottom: 1px solid var(--tdk-color-border);
      }
      header a {
        color: var(--tdk-color-accent);
      }
      .muted {
        color: var(--tdk-color-text-muted);
      }
      form {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
      }
      input,
      button {
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--tdk-color-border);
        border-radius: 4px;
        background: var(--tdk-color-surface-2);
        color: var(--tdk-color-text);
        font: inherit;
      }
      input {
        width: 100px;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        grid-template-areas: 'chart side' 'panel panel';
        gap: 8px;
        padding: 8px;
      }
      #chart {
        grid-area: chart;
        min-width: 0;
        height: 440px;
        border: 1px solid var(--tdk-color-border);
        border-radius: 4px;
        overflow: hidden;
      }
      aside {
        grid-area: side;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      tdk-account-panel {
        grid-area: panel;
        min-width: 0;
        min-height: 220px;
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas: 'chart' 'side' 'panel';
        }
        form {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>tickdeck from a CDN</strong>
      <span class="muted">version <span id="version">loading</span></span>
      <a href="../">All playground apps</a>
      <form id="market" autocomplete="off">
        <label for="market-price" class="muted">Simulated market</label>
        <input id="market-price" inputmode="decimal" />
        <button type="submit">Move</button>
      </form>
    </header>
    <main>
      <div id="chart"></div>
      <aside>
        <tdk-trade-buttons instrument="MOCK:ACME" quantity="10"></tdk-trade-buttons>
        <tdk-order-ticket instrument="MOCK:ACME" kind="limit" quantity="10"></tdk-order-ticket>
      </aside>
      <tdk-account-panel></tdk-account-panel>
    </main>
    <tdk-notifications placement="bottom-end"></tdk-notifications>

    <script type="module">
      import {
        BrokerSession,
        MockBroker,
        MockFeed,
        VERSION,
        addExact,
        attachTrading,
        createChartView,
        subtractExact,
      } from 'https://cdn.jsdelivr.net/npm/@tickdeck/all@0.1.0-alpha.2/dist/tickdeck.js';

      document.getElementById('version').textContent = VERSION;

      // One feed and one session for the chart and every widget.
      const feed = new MockFeed({ seed: 7 });
      const session = new BrokerSession(new MockBroker({ feed }));
      await session.start();

      const view = createChartView(document.getElementById('chart'), { feed, instrument: 'MOCK:ACME', timeframe: '1m' });
      const trading = attachTrading(view, session, { pnl: ['money', 'ticks'] });

      for (const element of document.querySelectorAll('tdk-trade-buttons, tdk-order-ticket, tdk-account-panel, tdk-notifications')) {
        element.session = session;
        element.feed = feed;
      }

      // "Modify" in the account panel opens the order in the ticket.
      const ticket = document.querySelector('tdk-order-ticket');
      document.querySelector('tdk-account-panel').addEventListener('tdk-amend', (event) => ticket.amend(event.detail.order));

      // Moves the mock market to a price (one tick each side); the random walk continues from there.
      document.getElementById('market').addEventListener('submit', (event) => {
        event.preventDefault();
        const info = view.instrumentInfo.value;
        const typed = Number(document.getElementById('market-price').value);
        if (!info || !(typed > 0)) return;
        const price = view.snapPrice(typed);
        void feed.setQuote(info.id, { bid: subtractExact(price, info.tickSize), ask: addExact(price, info.tickSize), last: price });
      });

      // For the browser console and the end-to-end tests.
      window.playground = { feed, session, view, trading };
    </script>
  </body>
</html>
